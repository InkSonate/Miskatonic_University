<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miskatonic University</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background-image: url('professorsanych.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Patrick Hand', cursive, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            color: white;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
            position: relative;
        }
        /* Новый переключатель языков */
        .lang-switch {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 5px 10px;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 1000;
        }
        .lang-option {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Patrick Hand', cursive;
            background: transparent;
            border: none;
            text-shadow: none;
        }
        .lang-option.active {
            background: #ffe484;
            color: #1a1a1a;
            box-shadow: 0 0 15px rgba(255,215,0,0.4);
        }
        .lang-option:hover:not(.active) {
            color: #fff;
        }
        .lang-option:focus {
            outline: none;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .header img { height: 50px; width: auto; }
        .header h1 {
            font-size: 3.5rem;
            font-weight: normal;
            letter-spacing: 4px;
            background: rgba(0,0,0,0.4);
            padding: 10px 30px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        .main-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            width: 100%;
        }
        .btn {
            display: inline-block;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffe484;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(255,200,0,0.5);
            border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            width: fit-content;
            min-width: 200px;
            text-align: center;
        }
        .btn:hover {
            background: rgba(255,215,0,0.3);
            border-color: #ffd700;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
        }
        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .bottom-left {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #7b7070;
            padding: 10px 20px;
            border-radius: 20px;
            flex-shrink: 0;
        }
        .bottom-left img { height: 80px; width: auto; }
        .bottom-left a {
            font-size: 2rem;
            font-weight: bold;
            color: #ffe484;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(255,200,0,0.5);
            transition: color 0.3s;
        }
        .bottom-left a:hover { color: #fff; text-decoration: underline; }
        .disclaimer {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
            text-align: right;
            max-width: 400px;
            text-shadow: none;
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 10px;
            flex-shrink: 1;
        }
        @media (max-width: 700px) {
            .lang-switch { top: 10px; right: 10px; padding: 3px 8px; }
            .lang-option { font-size: 0.9rem; padding: 3px 10px; }
            .header img { display: none; }
            .header h1 { font-size: 2.2rem; padding: 8px 20px; letter-spacing: 2px; }
            .btn { width: 90%; max-width: 350px; min-width: unset; font-size: 1.6rem; padding: 14px 20px; border-radius: 30px; }
            .footer-row {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            .bottom-left {
                width: 90%;
                max-width: 350px;
                justify-content: center;
                padding: 12px 20px;
                gap: 10px;
                border-radius: 30px;
                flex-wrap: nowrap;
            }
            .bottom-left img { height: 40px; }
            .bottom-left a { font-size: 1.4rem; white-space: nowrap; }
            .disclaimer {
                text-align: center;
                max-width: 90%;
                font-size: 0.6rem;
                padding: 6px 10px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Переключатель языков -->
    <div class="lang-switch">
        <button class="lang-option active" data-lang="ru" id="langRu">RU</button>
        <button class="lang-option" data-lang="en" id="langEn">EN</button>
    </div>

    <div class="header">
        <img src="znidosquid.png" alt="znidosquid left" id="iconLeft">
        <h1 id="mainTitle">Miskatonic University</h1>
        <img src="znidosquid.png" alt="znidosquid right" id="iconRight">
    </div>

    <div class="main-center">
        <a href="about.html" class="btn" id="btnAbout">About Us</a>
        <a href="steam.html" class="btn" id="btnSteam">We n Steam</a>
        <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="btn" id="btnRick">Nothing here yet</a>
    </div>

    <div class="footer-row">
        <div class="bottom-left">
            <img src="waiting.gif" alt="waiting">
            <a href="https://t.me/MiskatonicTeaParty" target="_blank" id="tgLink">t.me/MiskatonicTeaParty</a>
        </div>
        <div class="disclaimer" id="disclaimer">
            Все использованные изображения и материалы принадлежат их законным владельцам.<br>
            Сайт создан в развлекательных и пародийных целях, не является коммерческим проектом.
        </div>
    </div>

    <audio loop>
        <source src="nerd.mp3" type="audio/mpeg">
    </audio>
    <script>
        // Музыка
        (function() {
            var audio = document.querySelector('audio');
            if (audio) {
                audio.play().catch(function() {
                    document.addEventListener('click', function playOnClick() {
                        audio.play();
                        document.removeEventListener('click', playOnClick);
                    }, { once: true });
                });
            }
        })();

        // Переключение языка с двумя кнопками
        (function() {
            var translations = {
                ru: {
                    title: 'Miskatonic University',
                    btnAbout: 'О нас',
                    btnSteam: 'Мы в Стим',
                    btnRick: 'Пока ничего',
                    tg: 't.me/MiskatonicTeaParty',
                    disclaimer: 'Все использованные изображения и материалы принадлежат их законным владельцам.\nСайт создан в развлекательных и пародийных целях, не является коммерческим проектом.'
                },
                en: {
                    title: 'Miskatonic University',
                    btnAbout: 'About Us',
                    btnSteam: 'We n Steam',
                    btnRick: 'Nothing here yet',
                    tg: 't.me/MiskatonicTeaParty',
                    disclaimer: 'All images and materials used belong to their respective owners.\nThis site is for entertainment and parody purposes only, and is not a commercial project.'
                }
            };

            var currentLang = localStorage.getItem('siteLang') || 'ru';
            var langRu = document.getElementById('langRu');
            var langEn = document.getElementById('langEn');

            function setLanguage(lang) {
                var t = translations[lang];
                document.getElementById('mainTitle').textContent = t.title;
                document.getElementById('btnAbout').textContent = t.btnAbout;
                document.getElementById('btnSteam').textContent = t.btnSteam;
                document.getElementById('btnRick').textContent = t.btnRick;
                document.getElementById('tgLink').textContent = t.tg;
                document.getElementById('disclaimer').innerHTML = t.disclaimer.replace(/\n/g, '<br>');
                // Обновить активную кнопку
                if (lang === 'ru') {
                    langRu.classList.add('active');
                    langEn.classList.remove('active');
                } else {
                    langEn.classList.add('active');
                    langRu.classList.remove('active');
                }
                localStorage.setItem('siteLang', lang);
                currentLang = lang;
            }

            langRu.addEventListener('click', function() {
                if (currentLang !== 'ru') setLanguage('ru');
            });
            langEn.addEventListener('click', function() {
                if (currentLang !== 'en') setLanguage('en');
            });

            // Устанавливаем начальный язык
            setLanguage(currentLang);
        })();
    </script>
</body>
</html>
