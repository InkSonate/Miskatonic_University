<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game – Miskatonic University</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background-color: #6a6d72;
            background-image: url('TitleBackground.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: 'Patrick Hand', cursive, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            gap: 14px;
            padding: 20px 24px;
            color: white;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
            position: relative;
        }
        .lang-switch {
            position: fixed;
            top: 15px; right: 15px;
            display: flex;
            gap: 5px;
            background: rgba(23,40,42,0.72);
            backdrop-filter: blur(4px);
            padding: 5px 10px;
            border-radius: 30px;
            border: 2px solid rgba(79,179,174,0.35);
            z-index: 1000;
        }
        .lang-option {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #9fb5b2;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Patrick Hand', cursive;
            background: transparent;
            border: none;
            text-shadow: none;
        }
        .lang-option.active {
            background: #f2ecd8;
            color: #1f3d3d;
            box-shadow: 0 0 15px rgba(242,236,216,0.35);
        }
        .lang-option:hover:not(.active) { color: #fff; }
        .lang-option:focus { outline: none; }

        .volume-control {
            position: fixed;
            top: 70px; right: 15px;
            z-index: 1000;
            background: rgba(23,40,42,0.72);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid rgba(79,179,174,0.35);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volume-control span { color: #f2ecd8; font-size: 1.2rem; }
        .volume-control input[type="range"] { width: 80px; accent-color: #4fb3ae; background: transparent; cursor: pointer; }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
            margin: 0;
            background: rgba(23,40,42,0.66);
            backdrop-filter: blur(6px);
            border-radius: 24px;
            padding: 26px 36px;
            border: 1px solid rgba(79,179,174,0.25);
        }

        .game-info { flex: 1 1 300px; display: flex; flex-direction: column; gap: 20px; }
        .game-info h2 {
            font-size: 2.4rem;
            color: #e9e4a6;
            text-shadow: 0 0 20px rgba(233,228,166,0.35);
            word-break: break-word;
        }
        .game-info p {
            font-size: 1.5rem;
            line-height: 1.6;
            color: #e8e6df;
            text-shadow: 0 0 10px rgba(0,0,0,0.6);
        }
        .game-info .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .game-info .btn {
            align-self: flex-start;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1.45rem;
            font-weight: bold;
            font-family: 'Patrick Hand', cursive;
            color: #f2ecd8;
            text-decoration: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            border: 1px solid rgba(242,236,216,0.28);
            background: linear-gradient(145deg, rgba(47,93,94,0.92), rgba(30,62,63,0.92));
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 14px rgba(10,20,20,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
        }
        .game-info .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 26px rgba(79,179,174,0.35);
            background: linear-gradient(145deg, rgba(61,143,138,0.95), rgba(43,92,93,0.95));
        }
        .game-info .btn-download {
            background: linear-gradient(145deg, rgba(122,128,101,0.95), rgba(90,96,72,0.95));
            border-color: rgba(242,236,216,0.35);
            box-shadow: 0 4px 14px rgba(50,55,35,0.4);
        }
        .game-info .btn-download:hover {
            background: linear-gradient(145deg, rgba(140,147,116,0.95), rgba(108,114,86,0.95));
            box-shadow: 0 8px 26px rgba(160,170,130,0.4);
        }

        .game-gallery { flex: 1 1 400px; display: flex; flex-direction: column; align-items: center; }
        .game-gallery .main-image {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            border: 2px solid rgba(79,179,174,0.6);
            cursor: zoom-in;
            transition: transform 0.3s;
            object-fit: cover;
        }
        .game-gallery .main-image:hover { transform: scale(1.02); border-color: #4fb3ae; }
        .gallery-nav { display: flex; gap: 20px; margin: 15px 0; }
        .gallery-nav button {
            background: rgba(61,143,138,0.35);
            border: 2px solid #4fb3ae;
            color: #f2ecd8;
            font-size: 1.8rem;
            padding: 4px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Patrick Hand', cursive;
        }
        .gallery-nav button:hover { background: #4fb3ae; color: #14282a; }
        .gallery-dots { display: flex; gap: 10px; }
        .gallery-dots span {
            width: 12px; height: 12px; border-radius: 50%;
            background: rgba(242,236,216,0.3);
            transition: 0.3s;
        }
        .gallery-dots span.active { background: #4fb3ae; box-shadow: 0 0 10px #4fb3ae; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10,18,19,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            border: 2px solid #4fb3ae;
            object-fit: contain;
        }
        .modal-close {
            position: absolute;
            top: -40px; right: 0;
            background: none;
            border: none;
            color: #f2ecd8;
            font-size: 3rem;
            cursor: pointer;
            text-shadow: 0 0 20px rgba(79,179,174,0.5);
            transition: 0.3s;
        }
        .modal-close:hover { transform: scale(1.2); color: #4fb3ae; }
        .modal-nav { display: flex; gap: 30px; margin-top: 20px; }
        .modal-nav button {
            background: rgba(61,143,138,0.35);
            border: 2px solid #4fb3ae;
            color: #f2ecd8;
            font-size: 2.2rem;
            padding: 5px 25px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Patrick Hand', cursive;
        }
        .modal-nav button:hover { background: #4fb3ae; color: #14282a; }

        @media (max-width: 1100px) {
            body { align-items: center; }
        }
        @media (max-width: 700px) {
            body {
                background-size: contain;
                background-position: top center;
                background-color: #6a6d72;
                padding: 16px;
            }
            .lang-switch { top: 10px; right: 10px; padding: 3px 8px; }
            .lang-option { font-size: 0.9rem; padding: 3px 10px; }
            .volume-control { top: 55px; right: 8px; padding: 4px 8px; }
            .volume-control input[type="range"] { width: 50px; }
            .game-container { flex-direction: column; padding: 20px; }
            .game-info h2 { font-size: 2rem; }
            .game-info p { font-size: 1.2rem; }
            .game-info .btn { font-size: 1.2rem; padding: 10px 25px; align-self: stretch; text-align: center; }
            .game-gallery .main-image { max-width: 100%; }
            .modal-content img { max-height: 60vh; }
            .modal-nav button { font-size: 1.8rem; padding: 3px 15px; }
            .modal-close { font-size: 2.5rem; top: -30px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>

    <div class="lang-switch">
        <button class="lang-option active" data-lang="ru" id="langRu">RU</button>
        <button class="lang-option" data-lang="en" id="langEn">EN</button>
    </div>

    <div class="volume-control">
        <span>🔊</span>
        <input type="range" min="0" max="1" step="0.01" value="0.5" id="volumeSlider">
    </div>

    <div class="game-container">
        <div class="game-info">
            <h2 id="gameName">混凝土中的女孩 (Girl in Concrete)</h2>
            <p id="gameDesc">
                Морита Хару была убита 17 лет назад, за свои грехи при жизни она попадает в ад, переживая бесконечный цикл одинаковых дней и пытаясь все исправить.
            </p>
            <div class="btn-group">
                <a href="https://drive.google.com/file/d/18fjP4pVlSU6oEC6KMNpR8dlvjyB_1QU3/view?usp=sharing" target="_blank" class="btn btn-download" id="downloadBtn">Скачать</a>
                <a href="index.html" class="btn" id="backBtn">← Back to main</a>
            </div>
        </div>

        <div class="game-gallery">
            <img class="main-image" id="mainImage" src="gmscreen1.png" alt="screenshot">
            <div class="gallery-nav">
                <button id="prevImage">◀</button>
                <button id="nextImage">▶</button>
            </div>
            <div class="gallery-dots" id="dotsContainer">
                <span class="active"></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <img id="modalImage" src="" alt="full">
            <div class="modal-nav">
                <button id="modalPrev">◀</button>
                <button id="modalNext">▶</button>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="gg.mp3" type="audio/mpeg">
    </audio>

    <script>
        // === Музыка с синхронизацией ===
        (function() {
            var audio = document.getElementById('bgMusic');
            var slider = document.getElementById('volumeSlider');
            if (!audio || !slider) return;

            var savedTime = sessionStorage.getItem('musicTime');
            if (savedTime !== null) {
                audio.currentTime = parseFloat(savedTime);
            }

            var savedVolume = localStorage.getItem('siteVolume');
            if (savedVolume !== null) {
                audio.volume = parseFloat(savedVolume);
                slider.value = savedVolume;
            } else {
                audio.volume = 0.5;
                slider.value = 0.5;
            }

            audio.addEventListener('timeupdate', function() {
                sessionStorage.setItem('musicTime', audio.currentTime);
            });
            window.addEventListener('beforeunload', function() {
                sessionStorage.setItem('musicTime', audio.currentTime);
            });

            slider.addEventListener('input', function() {
                audio.volume = parseFloat(this.value);
                localStorage.setItem('siteVolume', this.value);
            });

            audio.play().catch(function() {
                document.addEventListener('click', function playOnClick() {
                    audio.play();
                    document.removeEventListener('click', playOnClick);
                }, { once: true });
            });
        })();

        // --- Переключение языка (заголовок удалён — строка про pageTitle убрана) ---
        (function() {
            var translations = {
                ru: {
                    name: '混凝土中的女孩 (Girl in Concrete)',
                    desc: 'Морита Хару была убита 17 лет назад, за свои грехи при жизни она попадает в ад, переживая бесконечный цикл одинаковых дней и пытаясь все исправить.',
                    download: 'Скачать',
                    back: '← На главную'
                },
                en: {
                    name: 'Girl in Concrete',
                    desc: 'Morita Haru was killed 17 years ago. For her sins in life, she is sent to hell, reliving an endless cycle of identical days and trying to make things right.',
                    download: 'Download',
                    back: '← Back to main'
                }
            };

            var currentLang = localStorage.getItem('siteLang') || 'ru';
            var langRu = document.getElementById('langRu');
            var langEn = document.getElementById('langEn');

            function setLanguage(lang) {
                var t = translations[lang];
                document.getElementById('gameName').textContent = t.name;
                document.getElementById('gameDesc').textContent = t.desc;
                document.getElementById('downloadBtn').textContent = t.download;
                document.getElementById('backBtn').textContent = t.back;
                if (lang === 'ru') {
                    langRu.classList.add('active');
                    langEn.classList.remove('active');
                } else {
                    langEn.classList.add('active');
                    langRu.classList.remove('active');
                }
                localStorage.setItem('siteLang', lang);
                currentLang = lang;
            }

            langRu.addEventListener('click', function() {
                if (currentLang !== 'ru') setLanguage('ru');
            });
            langEn.addEventListener('click', function() {
                if (currentLang !== 'en') setLanguage('en');
            });

            setLanguage(currentLang);
        })();

        // --- Галерея ---
        (function() {
            var images = ['gmscreen1.png', 'gmscreen2.png', 'slon.png'];
            var currentIndex = 0;
            var mainImage = document.getElementById('mainImage');
            var prevBtn = document.getElementById('prevImage');
            var nextBtn = document.getElementById('nextImage');
            var dots = document.querySelectorAll('#dotsContainer span');
            var modal = document.getElementById('modal');
            var modalImage = document.getElementById('modalImage');
            var modalClose = document.getElementById('modalClose');
            var modalPrev = document.getElementById('modalPrev');
            var modalNext = document.getElementById('modalNext');
            var isModalOpen = false;

            function updateMain(index) {
                mainImage.src = images[index];
                dots.forEach(function(dot, i) {
                    dot.classList.toggle('active', i === index);
                });
                currentIndex = index;
            }

            prevBtn.addEventListener('click', function() {
                var newIndex = (currentIndex - 1 + images.length) % images.length;
                updateMain(newIndex);
            });

            nextBtn.addEventListener('click', function() {
                var newIndex = (currentIndex + 1) % images.length;
                updateMain(newIndex);
            });

            mainImage.addEventListener('click', function() {
                openModal(currentIndex);
            });

            function openModal(index) {
                modalImage.src = images[index];
                modal.classList.add('active');
                isModalOpen = true;
                document.body.style.overflow = 'hidden';
                currentIndex = index;
            }

            function closeModal() {
                modal.classList.remove('active');
                isModalOpen = false;
                document.body.style.overflow = '';
            }

            modalClose.addEventListener('click', closeModal);

            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeModal();
            });

            modalPrev.addEventListener('click', function() {
                var newIndex = (currentIndex - 1 + images.length) % images.length;
                currentIndex = newIndex;
                modalImage.src = images[newIndex];
                updateMain(newIndex);
            });

            modalNext.addEventListener('click', function() {
                var newIndex = (currentIndex + 1) % images.length;
                currentIndex = newIndex;
                modalImage.src = images[newIndex];
                updateMain(newIndex);
            });

            document.addEventListener('keydown', function(e) {
                if (!isModalOpen) return;
                if (e.key === 'Escape') {
                    closeModal();
                } else if (e.key === 'ArrowLeft') {
                    modalPrev.click();
                } else if (e.key === 'ArrowRight') {
                    modalNext.click();
                }
            });

            updateMain(0);
        })();
    </script>
</body>
</html>
