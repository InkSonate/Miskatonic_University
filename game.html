<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game – Miskatonic University</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background-image: url('professorsanych.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Patrick Hand', cursive, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
            position: relative;
        }
        .lang-switch {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 5px 10px;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 1000;
        }
        .lang-option {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Patrick Hand', cursive;
            background: transparent;
            border: none;
            text-shadow: none;
        }
        .lang-option.active {
            background: #ffe484;
            color: #1a1a1a;
            box-shadow: 0 0 15px rgba(255,215,0,0.4);
        }
        .lang-option:hover:not(.active) { color: #fff; }
        .lang-option:focus { outline: none; }

        .volume-control {
            position: fixed;
            top: 70px;
            right: 15px;
            z-index: 1000;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volume-control span { color: #ffe484; font-size: 1.2rem; }
        .volume-control input[type="range"] { width: 80px; accent-color: #ffd700; background: transparent; cursor: pointer; }
        @media (max-width: 700px) {
            .volume-control { top: 60px; right: 10px; padding: 4px 8px; }
            .volume-control input[type="range"] { width: 60px; }
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            width: 100%;
            flex-wrap: wrap;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 3.5rem;
            font-weight: normal;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            margin: 0;
        }
        .header .header-icon {
            height: 70px;
            width: auto;
            order: -1;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
            margin: 20px 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(6px);
            border-radius: 30px;
            padding: 30px 40px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .game-info {
            flex: 1 1 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .game-info h2 {
            font-size: 2.8rem;
            color: #ffe484;
            text-shadow: 0 0 20px rgba(255,200,0,0.4);
            word-break: break-word;
        }
        .game-info p {
            font-size: 1.6rem;
            line-height: 1.6;
            color: #f0f0f0;
            text-shadow: 0 0 10px rgba(0,0,0,0.6);
        }
        .game-info .btn {
            align-self: flex-start;
            padding: 12px 35px;
            border-radius: 8px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffe484;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(255,200,0,0.3);
            border: none;
            background: linear-gradient(145deg, rgba(139,128,128,0.85), rgba(107,96,96,0.85));
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.15);
            transition: all 0.3s;
            cursor: pointer;
        }
        .game-info .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(255,215,0,0.3);
            background: linear-gradient(145deg, rgba(155,144,144,0.9), rgba(123,112,112,0.9));
        }

        .game-gallery {
            flex: 1 1 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-gallery .main-image {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            border: 2px solid rgba(255,215,0,0.5);
            cursor: zoom-in;
            transition: transform 0.3s;
            object-fit: cover;
        }
        .game-gallery .main-image:hover {
            transform: scale(1.02);
            border-color: #ffd700;
        }
        .gallery-nav {
            display: flex;
            gap: 20px;
            margin: 15px 0;
        }
        .gallery-nav button {
            background: rgba(255,215,0,0.3);
            border: 2px solid #ffd700;
            color: #ffe484;
            font-size: 2rem;
            padding: 5px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Patrick Hand', cursive;
        }
        .gallery-nav button:hover {
            background: #ffd700;
            color: #1a1a1a;
        }
        .gallery-dots {
            display: flex;
            gap: 10px;
        }
        .gallery-dots span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: 0.3s;
        }
        .gallery-dots span.active {
            background: #ffd700;
            box-shadow: 0 0 10px #ffd700;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 15px;
            border: 2px solid #ffd700;
            object-fit: contain;
        }
        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: #ffe484;
            font-size: 3rem;
            cursor: pointer;
            text-shadow: 0 0 20px rgba(255,200,0,0.5);
            transition: 0.3s;
        }
        .modal-close:hover {
            transform: scale(1.2);
            color: #fff;
        }
        .modal-nav {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }
        .modal-nav button {
            background: rgba(255,215,0,0.3);
            border: 2px solid #ffd700;
            color: #ffe484;
            font-size: 2.5rem;
            padding: 5px 25px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Patrick Hand', cursive;
        }
        .modal-nav button:hover {
            background: #ffd700;
            color: #1a1a1a;
        }

        @media (max-width: 700px) {
            .lang-switch { top: 10px; right: 10px; padding: 3px 8px; }
            .lang-option { font-size: 0.9rem; padding: 3px 10px; }
            .volume-control { top: 55px; right: 8px; }
            .volume-control input[type="range"] { width: 50px; }
            .header { justify-content: center; }
            .header .header-icon { display: none; }
            .header h1 { font-size: 2.2rem; padding: 0; letter-spacing: 2px; }
            .game-container {
                flex-direction: column;
                padding: 20px;
            }
            .game-info h2 { font-size: 2.2rem; }
            .game-info p { font-size: 1.2rem; }
            .game-gallery .main-image { max-width: 100%; }
            .modal-content img { max-height: 60vh; }
            .modal-nav button { font-size: 1.8rem; padding: 3px 15px; }
            .modal-close { font-size: 2.5rem; top: -30px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>

    <div class="lang-switch">
        <button class="lang-option active" data-lang="ru" id="langRu">RU</button>
        <button class="lang-option" data-lang="en" id="langEn">EN</button>
    </div>

    <div class="volume-control">
        <span>🔊</span>
        <input type="range" min="0" max="1" step="0.01" value="0.5" id="volumeSlider">
    </div>

    <div class="header">
        <img src="znidosquid.png" alt="znidosquid" class="header-icon">
        <h1 id="pageTitle">Game</h1>
    </div>

    <div class="game-container">
        <div class="game-info">
            <h2 id="gameName">混凝土中的女孩 (Girl in Concrete)</h2>
            <p id="gameDesc">
                Игра от Faraday, описание в доработке
            </p>
            <a href="index.html" class="btn" id="backBtn">← Back to main</a>
        </div>

        <div class="game-gallery">
            <img class="main-image" id="mainImage" src="gmscreen1.png" alt="screenshot">
            <div class="gallery-nav">
                <button id="prevImage">◀</button>
                <button id="nextImage">▶</button>
            </div>
            <div class="gallery-dots" id="dotsContainer">
                <span class="active"></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <img id="modalImage" src="" alt="full">
            <div class="modal-nav">
                <button id="modalPrev">◀</button>
                <button id="modalNext">▶</button>
            </div>
        </div>
    </div>

    <audio loop>
        <source src="nerd.mp3" type="audio/mpeg">
    </audio>

    <script>
        (function() {
            var audio = document.querySelector('audio');
            var slider = document.getElementById('volumeSlider');
            if (!audio || !slider) return;
            var saved = localStorage.getItem('siteVolume');
            if (saved !== null) {
                audio.volume = parseFloat(saved);
                slider.value = saved;
            } else {
                audio.volume = 0.5;
                slider.value = 0.5;
            }
            slider.addEventListener('input', function() {
                audio.volume = parseFloat(this.value);
                localStorage.setItem('siteVolume', this.value);
            });
            audio.play().catch(function() {
                document.addEventListener('click', function playOnClick() {
                    audio.play();
                    document.removeEventListener('click', playOnClick);
                }, { once: true });
            });
        })();

        (function() {
            var translations = {
                ru: {
                    title: 'Game',
                    name: '混凝土中的女孩 (Girl in Concrete)',
                    desc: 'Игра от Faraday, описание в доработке',
                    back: '← На главную'
                },
                en: {
                    title: 'Game',
                    name: 'Girl in Concrete',
                    desc: 'Game by Faraday, description under development',
                    back: '← Back to main'
                }
            };

            var currentLang = localStorage.getItem('siteLang') || 'ru';
            var langRu = document.getElementById('langRu');
            var langEn = document.getElementById('langEn');

            function setLanguage(lang) {
                var t = translations[lang];
                document.getElementById('pageTitle').textContent = t.title;
                document.getElementById('gameName').textContent = t.name;
                document.getElementById('gameDesc').textContent = t.desc;
                document.getElementById('backBtn').textContent = t.back;
                if (lang === 'ru') {
                    langRu.classList.add('active');
                    langEn.classList.remove('active');
                } else {
                    langEn.classList.add('active');
                    langRu.classList.remove('active');
                }
                localStorage.setItem('siteLang', lang);
                currentLang = lang;
            }

            langRu.addEventListener('click', function() {
                if (currentLang !== 'ru') setLanguage('ru');
            });
            langEn.addEventListener('click', function() {
                if (currentLang !== 'en') setLanguage('en');
            });

            setLanguage(currentLang);
        })();

        (function() {
            var images = ['gmscreen1.png', 'gmscreen2.png', 'slon.png'];
            var currentIndex = 0;
            var mainImage = document.getElementById('mainImage');
            var prevBtn = document.getElementById('prevImage');
            var nextBtn = document.getElementById('nextImage');
            var dots = document.querySelectorAll('#dotsContainer span');
            var modal = document.getElementById('modal');
            var modalImage = document.getElementById('modalImage');
            var modalClose = document.getElementById('modalClose');
            var modalPrev = document.getElementById('modalPrev');
            var modalNext = document.getElementById('modalNext');
            var isModalOpen = false;

            function updateMain(index) {
                mainImage.src = images[index];
                dots.forEach(function(dot, i) {
                    dot.classList.toggle('active', i === index);
                });
                currentIndex = index;
            }

            prevBtn.addEventListener('click', function() {
                var newIndex = (currentIndex - 1 + images.length) % images.length;
                updateMain(newIndex);
            });

            nextBtn.addEventListener('click', function() {
                var newIndex = (currentIndex + 1) % images.length;
                updateMain(newIndex);
            });

            mainImage.addEventListener('click', function() {
                openModal(currentIndex);
            });

            function openModal(index) {
                modalImage.src = images[index];
                modal.classList.add('active');
                isModalOpen = true;
                document.body.style.overflow = 'hidden';
                currentIndex = index;
            }

            function closeModal() {
                modal.classList.remove('active');
                isModalOpen = false;
                document.body.style.overflow = '';
            }

            modalClose.addEventListener('click', closeModal);

            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeModal();
            });

            modalPrev.addEventListener('click', function() {
                var newIndex = (currentIndex - 1 + images.length) % images.length;
                currentIndex = newIndex;
                modalImage.src = images[newIndex];
                updateMain(newIndex);
            });

            modalNext.addEventListener('click', function() {
                var newIndex = (currentIndex + 1) % images.length;
                currentIndex = newIndex;
                modalImage.src = images[newIndex];
                updateMain(newIndex);
            });

            document.addEventListener('keydown', function(e) {
                if (!isModalOpen) return;
                if (e.key === 'Escape') {
                    closeModal();
                } else if (e.key === 'ArrowLeft') {
                    modalPrev.click();
                } else if (e.key === 'ArrowRight') {
                    modalNext.click();
                }
            });

            updateMain(0);
        })();
    </script>
</body>
</html>
