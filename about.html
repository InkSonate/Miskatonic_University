<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us – Miskatonic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-image: url('professorsanych.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Patrick Hand', cursive, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            color: white;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .header img {
            height: 50px;
            width: auto;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: normal;
            letter-spacing: 4px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 30px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .content {
            max-width: 700px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            padding: 30px 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin: 20px 0;
        }

        .content p {
            font-size: 1.8rem;
            line-height: 1.6;
            color: #ffe484;
            text-shadow: 0 0 10px rgba(255, 200, 0, 0.3);
        }

        .back-link {
            margin-top: 30px;
            display: inline-block;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 12px 35px;
            border-radius: 50px;
            font-size: 1.6rem;
            color: #ffe484;
            text-decoration: none;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        @media (max-width: 700px) {
            .header h1 {
                font-size: 2.2rem;
                padding: 5px 15px;
            }
            .header img {
                height: 35px;
            }
            .content p {
                font-size: 1.3rem;
            }
            .back-link {
                font-size: 1.2rem;
                padding: 10px 20px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>

    <div class="header">
        <img src="znidosquid.png" alt="znidosquid left">
        <h1>About Us</h1>
        <img src="znidosquid.png" alt="znidosquid right">
    </div>

    <div class="content">
        <p>
            We r da group of "professors" of gr8 scince called "shitpost".<br>
            The princess Giselle n 2 other guys doing some bshit in da internet and thats all.<br>
            Literally.<br>
            On da mein page ya can cy aur telegram.
        </p>
    </div>

    <a href="index.html" class="back-link">← Back to main</a>

    <!-- Музыка – оставляем ту же, чтобы играла и здесь -->
    <audio autoplay loop>
        <source src="nerd.mp3" type="audio/mpeg">
    </audio>

</body>
</html>
